map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_blue {
    server 127.0.0.1:8001;
}

upstream api_green {
    server 127.0.0.1:8002;
}

upstream n8n {
    server 127.0.0.1:5678;
}

upstream frontend {
    server 127.0.0.1:3080;
}

# --- HTTP: ACME + redirect ---
server {
    listen 80;
    server_name api.bcsdlab.com n8n.bcsdlab.com stage.bcsdlab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: API ---
server {
    listen 443 ssl http2;
    server_name api.bcsdlab.com;

    ssl_certificate /etc/letsencrypt/live/bcsdlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bcsdlab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    client_max_body_size 10M;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 256;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://api_blue;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# --- HTTPS: Frontend ---
server {
    listen 443 ssl http2;
    server_name stage.bcsdlab.com;

    ssl_certificate /etc/letsencrypt/live/bcsdlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bcsdlab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    client_max_body_size 10M;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css text/html;
    gzip_min_length 256;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /v1/ {
        proxy_pass http://api_blue;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS: n8n ---
server {
    listen 443 ssl http2;
    server_name n8n.bcsdlab.com;

    ssl_certificate /etc/letsencrypt/live/bcsdlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bcsdlab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    client_max_body_size 10M;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css text/html;
    gzip_min_length 256;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
