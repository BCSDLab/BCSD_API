services:
  api-blue: &api
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../${GOOGLE_SERVICE_ACCOUNT_FILE}:/app/${GOOGLE_SERVICE_ACCOUNT_FILE}:ro
    ports:
      - "${API_BLUE_PORT}:8000"
    command: ["uvicorn", "bcsd_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "${GRACEFUL_TIMEOUT}"]
    stop_grace_period: ${GRACEFUL_TIMEOUT}s
    networks:
      bcsd:
        aliases:
          - api

  api-green:
    <<: *api
    ports:
      - "${API_GREEN_PORT}:8000"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      N8N_HOST: "${N8N_DOMAIN}"
      N8N_PROTOCOL: https
      WEBHOOK_URL: "https://${N8N_DOMAIN}/"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_AUTH_USER}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_AUTH_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      SYNC_TOKEN: "${SYNC_TOKEN}"
      GOOGLE_SHEETS_ID: "${GOOGLE_SHEETS_ID}"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../../workflows:/workflows:ro
      - ../../${GOOGLE_SERVICE_ACCOUNT_FILE}:/credentials/sa.json:ro
    networks:
      - bcsd

volumes:
  n8n-data:

networks:
  bcsd:
    external: true
